<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Insite - 이메일 인증</title>
    <style>
      @media (max-width: 600px) {
        .container { width: 100% !important; }
        .px-24 { padding-left: 16px !important; padding-right: 16px !important; }
        .hero-title { font-size: 28px !important; line-height: 36px !important; }
        .code { font-size: 28px !important; letter-spacing: 6px !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background:#f5f7fb;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" class="wrapper" style="background:#f5f7fb;">
      <tr>
        <td align="center">
          <!-- Outer container -->
          <table role="presentation" cellpadding="0" cellspacing="0" width="600" class="container" style="width:600px; max-width:100%;">
            <!-- Header / Logo -->
            <tr>
              <td class="px-24" style="padding:24px 24px 0 24px;">
                <!-- LOGO -->
                <img src="https://lh3.googleusercontent.com/d/1wIBoKqfG_O6OlVkCUQaZ_iVWSsOeUKue" width="150" alt="Insite Logo" style="display:block; border:0; outline:none; text-decoration:none; height:auto;">
              </td>
            </tr>

            <!-- Hero card -->
            <tr>
              <td style="padding:16px 24px 0 24px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="card" style="background:#eaf2ff; border-radius:12px;">
                  <tr>
                    <td style="padding:36px 28px 32px 28px;">
                      <h1 class="hero-title" style="margin:0 0 12px 0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size:32px; line-height:40px; font-weight:700; color:#111827;">
                        Welcome to Insite
                      </h1>
                      <p style="margin:0 0 20px 0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size:16px; line-height:24px; color:#374151;">
                        아래 인증코드를 회원가입 페이지에 입력해 주세요.
                      </p>

                      <!-- Code box -->
                      <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                        <tr>
                          <td class="code" dir="ltr" style="
                            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
                            font-size:32px; letter-spacing:8px; font-weight:700; text-align:center;
                            padding:14px 12px; border:1px solid #d1d5db; border-radius:10px;
                            background:#ffffff; color:#111827;">
                            ${code}
                          </td>
                        </tr>
                      </table>

                      <p style="margin:16px 0 0 0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size:14px; line-height:22px; color:#6b7280;">
                        보안을 위해 이 코드는 <strong>3분</strong> 후 만료됩니다.<br>본인이 요청하지 않았다면 이 메일을 무시해 주세요.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Spacer -->
            <tr><td style="height:28px; line-height:28px;">&nbsp;</td></tr>

            <!-- Footer -->
            <tr>
              <td style="background:#111111; padding:24px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="text-align:left;">
                      <a href="#" style="font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size:13px; color:#d1d5db; text-decoration:none; margin-right:16px;">Team Insite</a>
                    </td>
                  </tr>
                  <tr><td style="height:10px; line-height:10px;">&nbsp;</td></tr>
                  <tr>
                    <td style="font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size:12px; line-height:18px; color:#9ca3af;">
                      A Project of Samsung SW·AI Academy For Youth
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>

    <!-- 접근성/보안용 텍스트 버전 -->
    <div style="display:none; white-space:nowrap; font-size:0; line-height:0; max-height:0; max-width:0; opacity:0; overflow:hidden;">
      Insite 인증코드: {{CODE}} (3분 내 사용)
    </div>
  </body>
</html>
