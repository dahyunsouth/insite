server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 정적 파일 캐시
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d; access_log off; try_files $uri =404;
  }

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }
}